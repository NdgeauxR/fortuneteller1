<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Fortune Teller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Ndgeaux Fortune Teller</h1>
        <p>Enter your details below to reveal what the future holds!</p>
    </header>

    <main>
        <div class="input-area">
            <label for="nameInput">Your Name:</label>
            <input type="text" id="nameInput" placeholder="e.g., Alex">

            <label for="ageInput">Your Age:</label>
            <input type="number" id="ageInput" placeholder="e.g., 25">

            <button id="fortuneButton">Reveal My Fortune!</button>
        </div>

        <div class="result-area">
            <h2>Your Fortune:</h2>
            <p id="fortuneResult">Your destiny awaits...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Ndgeaux Fortune Inc.</p> </footer>

    <script src="script.js"></script>
</body>
</html>
